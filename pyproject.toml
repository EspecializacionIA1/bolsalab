[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsalab"
version = "0.1.0"
description = "Pipeline de ML de BolsaLAB: predicción de la reacción de un inversionista principiante ante una caída del mercado."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grupo 10 - Especialización en IA, Pontificia Universidad Javeriana" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
app = [
    "streamlit>=1.66.1",
]
# Herramientas de desarrollo: uv sync las instala por defecto
dev = ["pytest>=8.0", "jupyterlab>=4.1", "ipykernel>=6.29", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["bolsalab*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Errores, imports ordenados, bugs comunes y sintaxis moderna
select = ["E", "F", "I", "B", "UP"]
