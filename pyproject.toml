[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsalab"
version = "0.1.0"
description = "Pipeline de ML de BolsaLAB: predicción de la reacción de un inversionista principiante ante una caída del mercado."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grupo 10 - Especialización en IA, Pontificia Universidad Javeriana" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "optuna>=5.0.0",
    "mlflow>=3.18.0",
]

[dependency-groups]
app = [
    "streamlit>=1.66.1",
]
# Redes neuronales en PyTorch (notebooks/3_mejora_auroc/08 - Redes neuronales con PyTorch paso a paso.ipynb)
nn = ["torch>=2.5"]
# Herramientas de desarrollo: uv sync las instala por defecto
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "ruff>=0.4",
    "httpx>=0.28.1",
]
# API en FastAPI (backend/)
api = [
    "fastapi>=0.165.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools.packages.find]
include = ["bolsalab*"]

[tool.pytest.ini_options]
# Para que las pruebas encuentren backend/, que no es parte del paquete
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Errores, imports ordenados, bugs comunes y sintaxis moderna
select = ["E", "F", "I", "B", "UP"]
