[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsalab"
version = "0.1.0"
description = "Pipeline de ML de BolsaLAB: perfilamiento de riesgo, portafolio y simulador de caídas para inversionistas principiantes en Colombia."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grupo 10 - Especialización en IA, Pontificia Universidad Javeriana" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "requests-cache>=1.2",
    "yfinance==1.7.0",
    "holidays>=0.50",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "imbalanced-learn>=0.12",
    "shap>=0.45",
    "statsmodels>=0.14",
    "riskfolio-lib>=6.0",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Solo para el modelo de sentimiento: uv sync --extra nlp
nlp = ["transformers>=4.40", "datasets>=2.19", "torch>=2.2"]

[dependency-groups]
# Herramientas de desarrollo: uv sync las instala por defecto
dev = ["pytest>=8.0", "jupyterlab>=4.1", "ipykernel>=6.29", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["bolsalab*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Errores, imports ordenados, bugs comunes y sintaxis moderna
select = ["E", "F", "I", "B", "UP"]
